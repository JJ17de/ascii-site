name: "CI: Security"

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (7am Denver)
  workflow_dispatch:

permissions:
  contents: read
  packages: read           # pull the private image from ghcr.io
  security-events: write   # upload results to Security > Code scanning

env:
  IMAGE: ghcr.io/jj17de/ascii-site:latest   # must be lowercase

jobs:
  sbom-and-grype:
    name: SBOM (Syft) + vulnerability scan (Grype)
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "$IMAGE"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.4
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ascii-site-sbom.spdx.json

      - name: Scan SBOM (Grype)
        id: grype
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          fail-build: false
          output-format: sarif

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  trivy:
    name: Trivy (image + repo secrets & misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "$IMAGE"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Scan repo (secrets + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: sarif
          output: trivy-repo.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy repo results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
