  for (let k = 0; k < 7; k++) {
    const ton = 0.05 + 0.065 * k;
    if (t < ton) continue;
    const age = t - ton;
    const fl = age < 0.12 ? (h32(k, Math.floor(age * 60), 3) < 0.5 ? 0.3 : 1) : 1;
    const X = -18 + 6 * k;
    if (!proj(X - 1.3, 16.9, STAND_Z - 0.5)) continue;
    const xa = PJX, ya = PJY;
    if (!proj(X + 1.3, 16.1, STAND_Z - 0.5)) continue;
    const xb = PJX, yb = PJY;
    for (let iy = Math.floor(Math.min(ya, yb)); iy <= Math.floor(Math.max(ya, yb)); iy++) {
      for (let ix = Math.floor(xa); ix <= Math.floor(xb); ix++) {
        const edge = iy === Math.floor(Math.min(ya, yb)) || iy === Math.floor(Math.max(ya, yb)) || ix === Math.floor(xa) || ix === Math.floor(xb);
        put(ix + 0.5, iy + 0.5, edge ? C_HASH : C_AT, hslk(42, 40, (edge ? 80 : 96) * fl), -1.5e5);
      }
    }
    addHalo((xa + xb) / 2, (ya + yb) / 2, (5 + 3 * Math.exp(-age * 3)) * fl, 42, 50, 86, 0.5 * fl);
  }
}

const ROWV = new Float32Array(1024), ROWDY = new Float32Array(1024), ROWDZ = new Float32Array(1024);
function rayRows() {
  for (let iy = 0; iy < rows && iy < 1024; iy++) {
    const v = -(iy + 0.5 - cyRow) / (FOC * AR);
    ROWDY[iy] = v * cPc + sPc;
    ROWDZ[iy] = -v * sPc + cPc;
  }
}

function drawStands(t, E, shX, shZ) {
  if (t < 2.4) return;
  const fillR = 34 * easeOutCubic((t - 2.4) / 0.6);
  const flashP = 0.0008 + 0.022 * E * E * E;
  let halos = 0;
  const top = Math.max(0, Math.floor(horizonRow - 40));
  for (let iy = top; iy < Math.min(rows, Math.ceil(horizonRow)); iy++) {
    const ddy = ROWDY[iy], ddz = ROWDZ[iy];
    if (ddz <= 0.01) continue;
    const tt = (STAND_Z - camZ) / ddz;
    const Y = camY + ddy * tt;
    if (Y < 0 || Y > STAND_TOP + 0.7) continue;
    for (let ix = 0; ix < cols; ix++) {
      const u = (ix + 0.5 - cx) / FOC;
      const X = camX + u * tt;
      if (Math.abs(X) > fillR) continue;
      const i = iy * cols + ix;
      if (Y > STAND_TOP) {
        let ph = (X * 0.9 + t * 3) / 2.2;
        ph -= Math.floor(ph);
        const red = ph < 0.5;
        const k = hslk(red ? 356 : 0, red ? 80 : 0, (red ? 42 : 78) * (0.7 + 0.3 * E));
        if (-2e5 >= dep[i]) { dep[i] = -2e5; chr[i] = C_EQ; clr[i] = k; tag[i] = 0; }
        continue;
      }
      const sxI = Math.floor((X + 100) / 0.55), ryI = Math.floor(Y / 0.5);
      let fy = Y / 0.5 - ryI;
      fy += 0.12 * E * Math.sin(t * 7 + sxI * 0.7) * (E > 0.6 ? 1 : 0);
      const hs = h32(sxI, ryI, 5);
      if (hs < 0.22) continue;
      let c, k;
      if (h32(ix, iy, hf) < flashP) {
        c = C_STAR; k = hslk(0, 0, 96);
        if (halos < 40 && h32(ix, iy, hf + 9) < 0.3) { addHalo(ix + 0.5, iy + 0.5, 1.8, 0, 0, 90, 0.6); halos++; }
      } else if (fy > 0.58) {
        c = C_o; k = hslk(24, 30, (10 + 8 * hs) * (0.7 + 0.5 * E));
      } else {
        c = hs < 0.4 ? C_8 : hs < 0.7 ? C_HASH : C_PCT;
        const shirt = h32(sxI, ryI, 6);
        const hue = shirt < 0.35 ? 356 : shirt < 0.6 ? 220 : 0;
        const sat = shirt < 0.35 ? 55 : shirt < 0.6 ? 12 : 0;
        const lum = shirt > 0.85 ? 26 : 11 + 8 * hs;
        k = hslk(hue, sat, lum * (0.7 + 0.5 * E));
      }
      if (-2e5 >= dep[i]) { dep[i] = -2e5; chr[i] = c; clr[i] = k; tag[i] = 0; }
    }
  }
}

function drawFloor(t, shX, shZ, shR, shA) {
  if (t < 0.5) return;
  const rz = BASE_Z + 41 * easeOutCubic((t - 0.5) / 1.0);
  const iy0 = Math.max(0, Math.ceil(horizonRow));
  for (let iy = iy0; iy < rows; iy++) {
    const ddy = ROWDY[iy], ddz = ROWDZ[iy];
    if (ddy >= -1e-4) continue;
    const tt = -camY / ddy;
    const Z = camZ + ddz * tt;
    let fz = 0.05;
    if (iy + 1 < rows && ROWDY[iy + 1] < -1e-4) fz = Math.abs(camZ - ROWDZ[iy + 1] * camY / ROWDY[iy + 1] - Z);
    else if (iy > 0 && ROWDY[iy - 1] < -1e-4) fz = Math.abs(camZ - ROWDZ[iy - 1] * camY / ROWDY[iy - 1] - Z);
    const fx = tt / FOC;
    if (Z > rz) continue;
    const edge = rz - Z < 0.6 + fz && rz < FAR_Z + 12;
    const wx = 0.035 + fx * 0.5, wz = 0.035 + fz * 0.5;
    for (let ix = 0; ix < cols; ix++) {
      const u = (ix + 0.5 - cx) / FOC;
      const X = camX + u * tt;
      const i = iy * cols + ix;
      if (-1e5 < dep[i]) continue;
      let c = 0, k = -1;
      if (edge) { c = C_HASH; k = hslk(44, 60, 82); }
      else {
        const ax = Math.abs(X);
        const inCourt = ax <= SIDE_X + wx && Z >= BASE_Z && Z <= FAR_Z + wz;
        let line = false;
        if (inCourt) {
          if (Math.abs(ax - SIDE_X) < wx || Math.abs(Z - FAR_Z) < wz || Math.abs(Z - HALF_Z) < wz) line = true;
          else if ((Math.abs(ax - LANE_X) < wx && Z < FT_Z) || (Math.abs(Z - FT_Z) < wz && ax <= LANE_X)) line = true;
          else {
            const dzf = Z - FT_Z, rf = Math.hypot(X, dzf);
            const drf = 0.035 + 0.5 * (ax * fx + Math.abs(dzf) * fz) / Math.max(rf, 0.05);
            if (Math.abs(rf - 1.8) < drf && (dzf > 0 || ((Math.atan2(X, dzf) * 6) & 1))) line = true;
            const dz3 = Z - RIM_Z, r3 = Math.hypot(X, dz3);
            const dr3 = 0.035 + 0.5 * (ax * fx + Math.abs(dz3) * fz) / Math.max(r3, 0.05);
            if (Math.abs(r3 - ARC_R) < dr3 && ax <= CORNER_X && dz3 > 0) line = true;
            if (Math.abs(ax - CORNER_X) < wx && dz3 < Math.sqrt(ARC_R * ARC_R - CORNER_X * CORNER_X)) line = true;
            if (Math.abs(r3 - 1.22) < dr3 && dz3 > 0) line = true;
            const dzc = Z - HALF_Z, rc = Math.hypot(X, dzc);
            if (Math.abs(rc - 1.8) < 0.035 + 0.5 * (ax * fx + Math.abs(dzc) * fz) / Math.max(rc, 0.05)) line = true;
          }
        }
        const spot = 12 * Math.exp(-(X * X) / 20 - ((Z - 5) * (Z - 5)) / 110);
        const fade = 0.55 + 0.45 * Math.exp(-tt / 18);
        let L;
        if (line) { c = C_HASH; L = (58 + spot) * fade; k = 1; }
        else if (inCourt && ax < LANE_X && Z < FT_Z) {
          const hh = h32(ix, iy, 31);
          if (hh > 0.88) continue;
          c = tt < 6 ? C_EQ : C_DASH; L = (17 + 6 * hh + spot * 0.6) * fade; k = 2;
        } else if (inCourt) {
          const pi = Math.floor((X + 40) / 0.24);
          const pj = Math.floor((Z + 20 + (pi % 5) * 0.7) / 2.4);
          const ph = h32(pi, pj, 9);
          if (h32(ix, iy, 33) > 0.88) continue;
          c = tt < 6 ? C_EQ : C_DASH; L = (20 + 12 * ph + spot) * fade; k = 3;
        } else {
          if (h32(ix, iy, 35) > 0.5) continue;
          c = C_DASH; L = 9 * fade; k = 4;
        }
        if (shA > 0) {
          const dsx = X - shX, dsz = (Z - shZ) * 0.8;
          const ds = Math.sqrt(dsx * dsx + dsz * dsz);
          if (ds < shR) L *= 1 - shA * (1 - ds / shR);
        }
        if (k === 1) k = hslk(40, 12, L);
        else if (k === 2) k = hslk(356, 42, L);
        else if (k === 3) k = hslk(31, 42, L);
        else k = hslk(220, 10, L);
      }
      if (k >= 0) { dep[i] = -1e5; chr[i] = c; clr[i] = k; tag[i] = 0; }
    }
  }
}

function drawBoard(t) {
  if (t < 1.1) return;
  const p = clamp01((t - 1.1) / 0.4);
  const W = BOARD_X, Y0 = BOARD_Y0, Y1 = BOARD_Y1;
  const hw = W, hh = Y1 - Y0;
  const half = hw + hh + hw;
  const lim = p * half;
  const kf = hslk(210, 10, 80), kp = hslk(220, 8, 36);
  const segs = [[0, Y0, W, Y0], [W, Y0, W, Y1], [W, Y1, 0, Y1]];
  let acc = 0;
  for (let side = -1; side <= 1; side += 2) {
    acc = 0;
    for (let s = 0; s < 3; s++) {
      const g = segs[s];
      const len = Math.hypot(g[2] - g[0], g[3] - g[1]);
      if (acc >= lim) break;
      const f = Math.min(1, (lim - acc) / len);
      const ex = g[0] + (g[2] - g[0]) * f, ey = g[1] + (g[3] - g[1]) * f;
      if (s === 0) {
        for (let r = 0; r < 3; r++) line3(side * g[0], Y0 + r * 0.035, 0, side * ex, Y0 + r * 0.035, 0, 0.02, C_EQ, kp, 0);
      } else line3(side * g[0], g[1], 0, side * ex, ey, 0, 0.02, s === 1 ? C_PIPE : C_DASH, kf, 0);
      if (f < 1 && proj(side * ex, ey, 0)) addHalo(PJX, PJY, 3, 200, 30, 90, 0.6);
      acc += len;
    }
  }
  if (p >= 1) {
    const a = clamp01((t - 1.5) / 0.3);
    const ks = hslk(210, 10, 75, a);
    line3(-0.295, 3.2, 0.001, 0.295, 3.2, 0.001, 0.02, C_DASH, ks, 0);
    line3(-0.295, 3.65, 0.001, 0.295, 3.65, 0.001, 0.02, C_DASH, ks, 0);
    line3(-0.295, 3.2, 0.001, -0.295, 3.65, 0.001, 0.02, C_PIPE, ks, 0);
    line3(0.295, 3.2, 0.001, 0.295, 3.65, 0.001, 0.02, C_PIPE, ks, 0);
    const kg = hslk(200, 30, 70, 0.16 * a);
    for (let gx = -0.88; gx <= 0.88; gx += 0.07) {
      for (let gy = 2.98; gy <= 3.92; gy += 0.07) {
        if (h32(Math.round(gx * 100), Math.round(gy * 100), 3) > 0.35) continue;
        if (proj(gx, gy, 0.002)) put(PJX, PJY, C_COLON, kg, -1e4);
      }
    }
    line3(0, 2.96, 0.0, 0, 3.04, RIM_Z - RIM_R, 0.02, C_EQ, hslk(220, 8, 45), 0);
  }
}

function drawRim(t) {
  if (t < 1.4) return;
  const sweep = clamp01((t - 1.4) / 0.4) * TAU;
  const dy = rimDy(t);
  const imp = t > 8.12 ? Math.exp(-(t - 8.12) * 4) : 0;
  const n = 160;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU;
    if (a > sweep) break;
    const X = RIM_X + RIM_R * Math.sin(a), Z = RIM_Z - RIM_R * Math.cos(a);
    const front = Math.cos(a);
    const L = 46 + 10 * front + 40 * imp;
    if (proj(X, RIM_Y + dy, Z)) put(PJX, PJY, C_AT, hslk(16, 88, L), -PJZ + 0.02);
    if (proj(X, RIM_Y + dy - 0.022, Z)) put(PJX, PJY, C_O, hslk(16, 80, L * 0.7), -PJZ + 0.01);
  }
  if (sweep < TAU) {
    const a = sweep;
    if (proj(RIM_X + RIM_R * Math.sin(a), RIM_Y, RIM_Z - RIM_R * Math.cos(a))) {
      put(PJX, PJY, C_AT, hslk(30, 60, 98), -PJZ + 0.05);
      addHalo(PJX, PJY, 4, 24, 80, 80, 0.6);
    }
  }
  if (imp > 0.02 && proj(RIM_X, RIM_Y + dy, RIM_Z)) addHalo(PJX, PJY, 4 + 10 * imp, 30, 70, 90, 0.8 * imp);
}

const NETN = 12, NETL = 5;
const NETY = [0, 0.11, 0.22, 0.33, 0.43];
const NX = new Float32Array(NETN * NETL), NY = new Float32Array(NETN * NETL), NZ = new Float32Array(NETN * NETL);
function drawNet(t, bx, by, bz, ballIn) {
  if (t < 1.8) return;
  const vis = clamp01((t - 1.8) / 0.6) * (NETL - 1);
  const dy = rimDy(t);
  const tau = t - 8.12;
  for (let l = 0; l < NETL; l++) {
    const f = l / (NETL - 1);
    let r = RIM_R * 0.96 + (0.13 - RIM_R * 0.96) * f;
    let yy = RIM_Y + dy - NETY[l] * (1 - dy * 2), zz = 0;
    if (ballIn) r += 0.07 * Math.exp(-Math.pow((yy - by) / 0.13, 2));
    if (tau > 0) {
      yy -= 0.12 * f * Math.exp(-3 * tau) * Math.sin(14 * tau - l * 0.9);
      zz -= 0.1 * f * Math.exp(-2.5 * tau) * Math.sin(11 * tau - l);
    }
    zz += 0.01 * f * Math.sin(t * 1.3 + l);
    for (let k = 0; k < NETN; k++) {
      const a = (k + 0.5 * (l & 1)) / NETN * TAU;
      const j = l * NETN + k;
      NX[j] = RIM_X + r * Math.sin(a); NY[j] = yy; NZ[j] = RIM_Z - r * Math.cos(a) + zz;
    }
  }
  for (let l = 0; l < NETL - 1; l++) {
    const vf = clamp01(vis - l);
    if (vf <= 0) break;
    for (let k = 0; k < NETN; k++) {
      const j0 = l * NETN + k;
      const ja = (l + 1) * NETN + k;
      const jb = (l + 1) * NETN + ((l & 1) ? (k + 1) % NETN : (k + NETN - 1) % NETN);
      const back = NZ[j0] > RIM_Z;
      const kk = hslk(0, 0, back ? 62 : 88, back ? 0.55 : 0.9);
      line3(NX[j0], NY[j0], NZ[j0], NX[j0] + (NX[ja] - NX[j0]) * vf, NY[j0] + (NY[ja] - NY[j0]) * vf, NZ[j0] + (NZ[ja] - NZ[j0]) * vf, 0.025, 0, kk, -0.01);
      line3(NX[j0], NY[j0], NZ[j0], NX[j0] + (NX[jb] - NX[j0]) * vf, NY[j0] + (NY[jb] - NY[j0]) * vf, NZ[j0] + (NZ[jb] - NZ[j0]) * vf, 0.025, 0, kk, -0.01);
    }
  }
}

function drawImpact(t) {
  if (t < 8.12 || t > 9.4) return;
  const tau = t - 8.12;
  if (tau < 0.65) {
    for (let r = 0; r < 2; r++) {
      const tr = tau - r * 0.07;
      if (tr < 0) continue;
      const R = 0.25 + 3.2 * easeOutCubic(tr / 0.6);
      const a0 = 1 - tr / 0.65;
      const n = Math.ceil(R * 60);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        if (proj(RIM_X + R * Math.sin(a), RIM_Y, RIM_Z - R * Math.cos(a))) put(PJX, PJY, C_HASH, r ? hslk(356, 80, 60, a0) : hslk(0, 0, 95, a0), -PJZ - 0.5);
      }
    }
  }
  for (let i = 0; i < SPKN; i++) {
    const tl = tau / SPL[i];
    if (tl > 1) continue;
    const X = RIM_X + Math.sin(SPA[i]) * SPV[i] * tau;
    const Z = RIM_Z - Math.cos(SPA[i]) * SPV[i] * tau;
    const Y = RIM_Y + SPU[i] * tau - 4.9 * tau * tau;
    if (!proj(X, Y, Z)) continue;
    const ch = tl < 0.35 ? C_STAR : tl < 0.7 ? C_PLUS : C_DOT;
    const k = SPH[i] < 0 ? hslk(0, 0, 96, 1 - 0.6 * tl) : hslk(SPH[i], 70, 70, 1 - 0.6 * tl);
    put(PJX, PJY, ch, k, -PJZ + 1);
  }
}

function floorRing(X, Z, R, ch, k) {
  const n = Math.ceil(R * 50) + 12;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    if (proj(X + R * Math.sin(a), 0.01, Z + R * Math.cos(a))) put(PJX, PJY, ch, k, -PJZ - 0.3);
  }
}

function drawConfetti(t) {
  if (t < 10.6) return;
  for (let i = 0; i < CFN; i++) {
    const age = t - CFT[i];
    if (age < 0) continue;
    let fall = CFV[i] * age;
    fall -= 7.5 * Math.floor(fall / 7.5);
    const Y = CFY[i] - fall;
    const X = CFX[i] + 0.35 * Math.sin(age * 1.7 + CFP[i]);
    const Z = CFZ[i] + 0.2 * Math.cos(age * 1.3 + CFP[i]);
    if (Y < 0.02 || !proj(X, Y, Z)) continue;
    const sp = Math.floor(age * CFS[i] + CFP[i] * 3) & 3;
    const ch = sp === 0 ? C_DASH : sp === 1 ? C_SL : sp === 2 ? C_PIPE : C_BS;
    const k = CFR[i] ? hslk(356, 82, 52) : hslk(0, 0, 94);
    put(PJX, PJY, ch, k, -PJZ);
  }
}

function drawSwoosh(t) {
  if (t < 8.0 || t > 8.4) return;
  for (let k = 1; k <= 14; k++) {
    const tk = t - k * 0.011;
    if (tk < 7.95 || tk > 8.25) continue;
    if (tk < 8.0) poseLeap(PTMP, tk); else poseSlam(PTMP, tk);
    if (!proj(PTMP[0] + PTMP[4], PTMP[2] + PTMP[5], PTMP[1] + PTMP[6])) continue;
    const q = k / 14;
    put(PJX, PJY, q < 0.4 ? C_STAR : q < 0.75 ? C_PLUS : C_DOT, hslk(30, 30, 95, 1 - 0.8 * q), -PJZ + 0.3);
  }
}

function drawPlay(g) {
  const word = 'PLAY';
  const pxW = 3, pxH = 2;
  const totalPx = word.length * 5 + (word.length - 1);
  const left = Math.round(cx - totalPx * pxW / 2);
  const top = Math.round(rows * 0.5 - 7 * pxH / 2);
  const tf = Math.floor(g * 9);
  for (let l = 0; l < word.length; l++) {
    const glyph = FONT57[word[l]];
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 5; c++) {
        if (glyph[r][c] !== '#') continue;
        for (let sy = 0; sy < pxH; sy++) {
          for (let sx = 0; sx < pxW; sx++) {
            const ix = left + (l * 6 + c) * pxW + sx;
            const iy = top + r * pxH + sy;
            const h = h32(ix, iy, tf);
            const ch = h < 0.1 ? C_AT : h < 0.17 ? C_STAR : C_HASH;
            const L = 56 + 10 * Math.sin(g * 1.8 + ix * 0.12 - iy * 0.2) + (h < 0.1 ? 14 : 0);
            put(ix + 0.5, iy + 0.5, ch, hslk(356, 70, L), 10);

    }
  }
}

function drawScene(t) {
  setCamera(t);

      }
      if (proj(bx, by, bz)) addHalo(PJX, PJY, 4, 24, 80, 80, 0.5);
    }
  }
  if (t >= 3.22 && t < 3.9) {
    const u = (t - 3.22) / 0.68;
    floorRing(0, 13.4, 0.3 + 2.2 * easeOutCubic(u), C_HASH, hslk(24, 70, 80, 1 - u));
  }
  if (t >= 10.05 && t < 10.6) {
    const u = (t - 10.05) / 0.55;
    floorRing(PO[0], PO[1], 0.25 + 1.0 * easeOutCubic(u), u < 0.5 ? C_COLON : C_DOT, hslk(31, 30, 70, 0.8 * (1 - u)));
  }
  drawSwoosh(t);
  drawImpact(t);
  drawConfetti(t);
}

/* ------------------------------------------------------------------ */
/* rendering                                                           */
/* ------------------------------------------------------------------ */

function render() {
  let n = 0;
  const N = NCELL;
  for (let i = 0; i < N; i++) {
    if (chr[i]) sortBuf[n++] = clr[i] * N + i;
  }
  const sb = sortBuf.subarray(0, n);
  sb.sort();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  octx.globalAlpha = 1;
  octx.clearRect(0, 0, off.width, off.height);
  octx.font = FONT;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  let last = -1;
  for (let j = 0; j < n; j++) {
    const v = sb[j];
    const k = Math.floor(v / N);
    const i = v - k * N;
    if (k !== last) { octx.fillStyle = palStr(k); last = k; }
    const iy = (i / cols) | 0;
    octx.fillText(CHS[chr[i]], XP[i - iy * cols], YP[iy]);
  }
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalCompositeOperation = 'source-over';
  mctx.globalAlpha = 1;
  mctx.drawImage(bgc, 0, 0);
  mctx.drawImage(off, 0, 0);

  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.clearRect(0, 0, bloomA.width, bloomA.height);
  if (FILTER_OK) actx.filter = 'blur(' + (0.006 * PW * DPR * 0.5).toFixed(2) + 'px)';
  actx.drawImage(off, 0, 0, bloomA.width, bloomA.height);
  if (FILTER_OK) actx.filter = 'none';

  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, bloomB.width, bloomB.height);
  if (FILTER_OK) bctx.filter = 'blur(' + (0.02 * PW * DPR * 0.25).toFixed(2) + 'px)';
  bctx.drawImage(off, 0, 0, bloomB.width, bloomB.height);
  if (FILTER_OK) bctx.filter = 'none';

  mctx.globalCompositeOperation = 'screen';
  mctx.globalAlpha = 0.4;
  mctx.drawImage(bloomA, 0, 0, cv.width, cv.height);
  mctx.globalAlpha = 0.12;
  mctx.drawImage(bloomB, 0, 0, cv.width, cv.height);
  mctx.globalAlpha = 1;
  mctx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------------ */
/* sound                                                               */
/* ------------------------------------------------------------------ */

let AC = null, BUS = null, NOISE = null;
const DEG = [0, 2, 4, 7, 9];
function NOTE(i) {
  const o = Math.floor(i / 5);
  const d = DEG[((i % 5) + 5) % 5];
  return 523.25 * Math.pow(2, (d + 12 * o) / 12);
}
function initAudio() {
  try {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      const sr = AC.sampleRate;
      NOISE = AC.createBuffer(1, Math.floor(sr * 2), sr);
      const nd = NOISE.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const len = Math.floor(sr * 2.4);
      const ir = AC.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) { const q = 1 - i / len; d[i] = (Math.random() * 2 - 1) * q * q * q; }
      }
      BUS = AC.createGain();
      const dry = AC.createGain(); dry.gain.value = 0.85;
      const conv = AC.createConvolver(); conv.buffer = ir;
      const wet = AC.createGain(); wet.gain.value = 0.32;
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      const master = AC.createGain(); master.gain.value = 1.3;
      BUS.connect(dry); dry.connect(comp);
      BUS.connect(conv); conv.connect(wet); wet.connect(comp);
      comp.connect(master); master.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function audioOK() { return !!AC && AC.state === 'running'; }
function outNode(pan) {
  if (!pan || !AC.createStereoPanner) return BUS;
  const p = AC.createStereoPanner();
  p.pan.value = Math.max(-1, Math.min(1, pan));
  p.connect(BUS);
  return p;
}
function bell(freq, at, vol, decay, pan) {
  decay = decay || 1.4;
  const out = outNode(pan);
  const parts = [1, 2.76, 5.4], lv = [1, 0.2, 0.07];
  for (let i = 0; i < 3; i++) {
    const f = freq * parts[i];
    if (f > 18000) continue;
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, at);
    const g = AC.createGain();
    const dk = decay / (1 + i * 0.9);
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol * lv[i], at + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.004 + dk);
    o.connect(g); g.connect(out);
    o.start(at); o.stop(at + 0.004 + dk + 0.05);
  }
}
function noiseBurst(at, dur, f0, f1, q, vol, attack, pan) {
  const src = AC.createBufferSource();
  src.buffer = NOISE; src.loop = true;
  const bq = AC.createBiquadFilter();
  bq.type = 'bandpass'; bq.Q.setValueAtTime(q, at);
  bq.frequency.setValueAtTime(f0, at);
  bq.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  src.connect(bq); bq.connect(g); g.connect(outNode(pan));
  src.start(at, Math.random() * 1.5);
  src.stop(at + dur + 0.05);
}
function glide(type, f0, f1, at, dur, vol, attack, pan) {
  const o = AC.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, at);
  o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(outNode(pan));
  o.start(at); o.stop(at + dur + 0.05);
}
function pad(freq, at, vol, attack, dur) {
  const o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, at);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(BUS);
  o.start(at); o.stop(at + dur + 0.05);
}
let crowdSrc = null, crowdGain = null;
function startCrowd(at) {
  stopCrowd();
  const src = AC.createBufferSource();
  src.buffer = NOISE; src.loop = true;
  const b1 = AC.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.setValueAtTime(650, at); b1.Q.setValueAtTime(0.8, at);
  const b2 = AC.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.setValueAtTime(1700, at); b2.Q.setValueAtTime(1.2, at);
  const g2 = AC.createGain(); g2.gain.setValueAtTime(0.5, at);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, at);
  src.connect(b1); src.connect(b2); b2.connect(g2);
  b1.connect(g); g2.connect(g); g.connect(BUS);
  src.start(at, Math.random());
  crowdSrc = src; crowdGain = g;
}
function stopCrowd() {
  if (!crowdSrc || !AC) return;
  const now = AC.currentTime;
  try {
    crowdGain.gain.cancelScheduledValues(now);
    crowdGain.gain.setTargetAtTime(0.0001, now, 0.08);
    crowdSrc.stop(now + 0.7);
  } catch (e) { }
  crowdSrc = null; crowdGain = null;
}
function clang(at, f, vol, decay, pan) {
  bell(f, at, vol, decay, pan);
  bell(f * 1.47, at + 0.002, vol * 0.45, decay * 0.7, pan);
  bell(f * 2.09, at + 0.004, vol * 0.25, decay * 0.5, pan);
}
function thump(at, f0, f1, dur, vol) {
  glide('sine', f0, f1, at, dur, vol, 0.004, 0);
  noiseBurst(at, 0.03, 1800, 1500, 2, vol * 0.18, 0.002, 0);
}

const CUES = [
  [0.5, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 1.0, 250, 2400, 1.2, 0.09, 0.25, 0);
    glide('sine', 70, 140, n, 1.0, 0.08, 0.2, 0);
  }],
  [1.1, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.5, 7000, 9000, 2, 0.03, 0.1, 0);
    bell(NOTE(10), n, 0.05, 1.2, -0.5);
    bell(NOTE(12), n + 0.2, 0.05, 1.2, 0.5);
  }],
  [1.4, function () {
    const n = AC.currentTime + 0.005;
    glide('sine', 500, 1000, n, 0.4, 0.05, 0.1, 0);
    clang(n + 0.4, 620, 0.12, 1.6, 0);
  }],
  [1.8, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.6, 3200, 1800, 1.5, 0.05, 0.12, 0);
  }],
  [2.4, function () {
    const n = AC.currentTime + 0.005;
    startCrowd(n);
    const ch = [0, 2, 4];
    for (let k = 0; k < 3; k++) bell(NOTE(ch[k]), n + k * 0.05, 0.05, 1.6, (k - 1) * 0.5);
  }],
  [3.0, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.22, 600, 3000, 2, 0.1, 0.12, -0.6);
    glide('sine', 300, 900, n + 0.18, 0.08, 0.12, 0.004, 0);
    thump(n + 0.22, 160, 70, 0.14, 0.25);
    bell(NOTE(5), n + 0.22, 0.08, 1.2, -0.2);
    bell(NOTE(7), n + 0.24, 0.08, 1.2, 0.2);
  }],
  [6.6, function () {
    const n = AC.currentTime + 0.005;
    for (let k = 0; k < 2; k++) {
      const at = n + k * 0.3;
      glide('sine', 2100, 2900, at, 0.09, 0.05, 0.01, k ? 0.3 : -0.3);
      noiseBurst(at, 0.06, 3000, 2800, 3, 0.04, 0.005, 0);
      thump(at + 0.02, 120, 55, 0.18, 0.3);
    }
  }],
  [7.2, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.8, 300, 1800, 1.0, 0.08, 0.5, 0);
    glide('sine', 90, 180, n, 0.8, 0.1, 0.3, 0);
  }],
  [8.0, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.12, 1500, 4000, 1.5, 0.1, 0.06, 0);
    const at = n + 0.12;
    glide('sine', 120, 38, at, 0.6, 0.7, 0.004, 0);
    clang(at, 410, 0.22, 2.2, 0);
    noiseBurst(at, 0.35, 4200, 1400, 1.2, 0.14, 0.01, 0);
    const ch = [0, 4, 7];
    for (let k = 0; k < 3; k++) bell(NOTE(ch[k]), at + 0.03 + k * 0.01, 0.08, 2.0, (k - 1) * 0.6);
  }],
  [8.25, function () {
    const n = AC.currentTime + 0.005;
    for (let k = 0; k < 5; k++) clang(n + k * 0.085, 380 + 20 * k, 0.09 * (1 - k * 0.17), 0.35, (k % 2 ? 0.3 : -0.3));
  }],
  [8.55, function () {
    const n = AC.currentTime + 0.005;
    thump(n, 140, 60, 0.15, 0.45);
  }],
  [9.6, function () {
    const n = AC.currentTime + 0.005;
    glide('sine', 300, 220, n, 0.3, 0.05, 0.01, 0);
    clang(n, 400, 0.05, 0.6, 0);
    bell(NOTE(2), n + 0.05, 0.05, 1.0, 0);
  }],
  [10.05, function () {
    const n = AC.currentTime + 0.005;
    thump(n, 110, 45, 0.3, 0.5);
    glide('sine', 2200, 2700, n + 0.02, 0.07, 0.04, 0.01, 0.2);
    noiseBurst(n, 0.4, 600, 300, 0.8, 0.05, 0.02, 0);
  }],
  [10.6, function () {
    const n = AC.currentTime + 0.005;
    noiseBurst(n, 0.3, 900, 4000, 0.8, 0.08, 0.02, 0);
    for (let k = 0; k < 12; k++) {
      bell(NOTE(8 + Math.floor(Math.random() * 7)), n + 0.05 + k * 0.11, 0.045, 1.0, Math.random() * 1.6 - 0.8);
    }
  }]
];
for (let k = 0; k < 7; k++) {
  CUES.push([0.05 + 0.065 * k, function () {
    const n = AC.currentTime + 0.005;
    thump(n, 95, 42, 0.25, 0.22);
    bell(NOTE(-5 + k), n, 0.03, 0.8, -0.75 + k * 0.25);
  }]);
}
CUES.sort(function (a, b) { return a[0] - b[0]; });

let lastBounce = 0, lastStepN = 0;
function runAudio(prevT, t) {
  for (let c = 0; c < CUES.length; c++) {
    const ct = CUES[c][0];
    if (prevT < ct && t >= ct) {
      if (audioOK()) { try { CUES[c][1](); } catch (e) { } }
    }
  }
  if (t >= 3.4 && t < 6.6) {
    const ph = runPhase(t);
    const bi = Math.floor(ph / TAU + 0.5);
    const si = Math.floor((ph - Math.PI / 2) / Math.PI) + 1;
    poseRun(PTMP, t);
    const near = clamp01(4 / Math.max(1, PTMP[1] - camZ));
    if (audioOK()) {
      const n = AC.currentTime + 0.005;
      while (lastBounce < bi) {
        lastBounce++;
        thump(n, 150, 65, 0.12, 0.12 + 0.3 * near);
      }
      while (lastStepN < si) {
        lastStepN++;
        noiseBurst(n, 0.05, 2600, 2400, 3, 0.012 + 0.03 * near, 0.005, lastStepN % 2 ? 0.2 : -0.2);
      }
    } else { lastBounce = bi; lastStepN = si; }
  }
  if (crowdGain && audioOK()) {
    const E = excite(t);
    crowdGain.gain.setTargetAtTime(0.0001 + 0.13 * Math.pow(E, 1.6), AC.currentTime, 0.12);
  }
}

/* ------------------------------------------------------------------ */
/* clock, state and input                                              */
/* ------------------------------------------------------------------ */

let state = 'start';
let paused = false, pauseAt = 0, pausedTotal = 0;
const T0 = performance.now();
let filmStart = 0, prevT = -1;
function gnow() { return ((paused ? pauseAt : performance.now()) - T0 - pausedTotal) / 1000; }
function filmT() { return gnow() - filmStart; }

function startFilm() {
  initAudio();
  if (paused) togglePause();
  state = 'play';
  filmStart = gnow();
  prevT = -0.001;
  lastBounce = 0; lastStepN = 0;
  if (AC) stopCrowd();
  cv.style.cursor = 'none';
  dirty = true;
}
function togglePause() {
  const now = performance.now();
  if (paused) {
    pausedTotal += now - pauseAt;
    paused = false;
    if (AC && AC.state === 'suspended') AC.resume();
  } else {
    pauseAt = now;
    paused = true;
    if (AC && AC.state === 'running') AC.suspend();
  }
  dirty = true;
}
window.addEventListener('click', function () {
  if (state === 'start') startFilm();
  else if (filmT() >= FILM_END) startFilm();
});
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (state === 'start') startFilm();
    else togglePause();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (state === 'start' || filmT() >= FILM_END) startFilm();
  } else if (e.key === 'r' || e.key === 'R') {
    if (state === 'play') startFilm();
  }
});
window.addEventListener('resize', layout);

function frame() {
  requestAnimationFrame(frame);
  if (paused && !dirty) return;
  dirty = false;
  const g = gnow();
  hf = Math.floor(g * 9);
  haloN = 0;
  clearGrid();
  if (state === 'start') {
    setCamera(0);
    drawDust(g);
    drawPlay(g);
  } else {
    const t = g - filmStart;
    setCamera(t);
    drawDust(g);
    drawScene(t);
    if (!paused) runAudio(prevT, t);
    prevT = t;
  }
  applyHalos(hf);
  render();
}

layout();
requestAnimationFrame(frame);
})();
</script>
